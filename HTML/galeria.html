<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ejercicio 1 - Suma</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f1f5f9; padding:20px; }
    .card { background:#fff; padding:20px; border-radius:10px; max-width:500px; margin:auto; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    button { background:#2563eb; color:#fff; border:0; padding:8px 12px; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Ejercicio 1 — Suma</h2>
    <p>Calcula: <strong>487 + 365</strong></p>
    <input type="number" id="resp1" placeholder="Tu respuesta">
    <button onclick="check()">Comprobar</button>
    <p id="out"></p>
    <details><summary>Solución</summary><p>487 + 365 = 852</p></details>
  </div>

  <script>
    function check() {
      const val = Number(document.getElementById('resp1').value);
      document.getElementById('out').textContent = (val === 852) ? "✅ Correcto" : "❌ Incorrecto";
    }
  </script>
</body>
</html>
